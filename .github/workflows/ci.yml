name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Droits minimaux : ce workflow lit le code, il n'écrit rien
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente de la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # MongoDB pour les tests d'intégration (même version qu'en local, ADR-0004)
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_TEST_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Même commandes qu'en local (voir CONTRIBUTING.md)
      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -rs
